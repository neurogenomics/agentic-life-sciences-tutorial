<div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="Search">
  <div class="search-dialog">
    <div class="search-input-wrap">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="flex-shrink:0;margin-right:0.5rem;color:var(--text-muted)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input
        type="search"
        id="search-input"
        data-testid="search-input"
        placeholder="Search tutorials..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Search tutorials"
        aria-autocomplete="list"
        aria-controls="search-results"
      >
      <button class="btn-icon search-close" id="search-close" type="button" aria-label="Close search" style="margin-left:0.5rem">
        <svg viewBox="0 0 24 24" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="search-results" id="search-results" data-testid="search-results" role="listbox" aria-label="Search results"></div>
    <p class="search-no-results" data-testid="search-no-results" style="display:none;padding:1rem 1.25rem;margin:0;color:var(--text-muted);font-size:0.875rem">
      No results found.
    </p>
  </div>
</div>
