title: Skills Cookbook

# Use the Cayman theme - clean, academic, professional
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme

# GitHub repository info
repository: neurogenomics/skills-cookbook
github_username: neurogenomics

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Permalink settings for clean URLs (no .html extension)
permalink: /:path/:basename/

# Include tutorials folder
include:
  - tutorials

# Disable download buttons for cleaner layout
show_downloads: false

# Google Analytics (optional - remove or replace with your tracking ID)
# google_analytics: UA-XXXXXXXX-X
