<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div class="site-shell">
      <header class="site-header" role="banner">
        <div class="header-inner">
          <a class="site-home" href="{{ '/' | relative_url }}">{{ site.title }}</a>
          <div class="header-actions">
            <button class="btn-icon btn-search" type="button" aria-label="Search">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <button class="btn-icon btn-hamburger" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
              <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
          </div>
        </div>
      </header>

      <main id="main-content">
        {{ content }}
      </main>

      <footer class="site-footer" role="contentinfo">
        <p>Keeping workflows tidy for the UKDRI labs &middot; {{ site.time | date: '%Y' }}</p>
      </footer>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    {% include search-modal.html %}

    <script src="{{ '/assets/vendor/lunr.min.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/sidebar.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/toc.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
  </body>
</html>
