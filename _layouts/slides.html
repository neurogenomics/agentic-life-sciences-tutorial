<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/vendor/reveal.js/dist/reveal.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/slides.css' | relative_url }}">
</head>
<body>
  <a class="back-to-tutorial" href="{{ page.tutorial_url | default: '/tutorials' | relative_url }}" data-testid="back-to-tutorial">
    ← Back to tutorial
  </a>

  <div class="reveal">
    <div class="slides"
         {% if page.tutorial_url %}data-tutorial-url="{{ page.tutorial_url | relative_url }}"{% endif %}>
      {{ content }}
    </div>
  </div>

  <script src="{{ '/assets/vendor/reveal.js/dist/reveal.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/slides.js' | relative_url }}"></script>
</body>
</html>
